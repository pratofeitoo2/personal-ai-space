[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opencode_mem_mcp"

[project]
name = "opencode-mem-mcp"
version = "0.1.0"
description = "MCP server for opencode-mem plugin — store and search vector memories locally"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
]

[project.scripts]
opencode-mem-mcp = "opencode_mem_mcp.server:serve"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
