[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "project_mcp"

[project]
name = "project-context-mcp"
version = "0.1.0"
description = "MCP server for project context access"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
]

[project.scripts]
project-context-mcp = "project_mcp:serve"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]