[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "task_mcp"

[project]
name = "task-management-mcp"
version = "0.1.0"
description = "MCP server for task management - integrates with Personal AI Powerhouse task system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
]

[project.scripts]
task-management-mcp = "task_mcp:serve"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]