<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .animate-slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }
        
        .animate-pulse-slow {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 0.5rem;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Card hover effects */
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        
        /* Status badges */
        .status-completed {
            background-color: #d1fae5;
            color: #065f46;
        }
        
        .status-pending {
            background-color: #fef3c7;
            color: #92400e;
        }
        
        /* Smooth transitions for filters */
        .filter-transition {
            transition: all 0.3s ease;
        }
        
        /* Live indicator */
        .live-indicator {
            animation: pulse 2s ease-in-out infinite;
        }

        /* Theme variables */
        html.light {
            --bg-primary: #f9fafb;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f3f4f6;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --accent: #3b82f6;
        }

        html.dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent: #60a5fa;
        }

        body {
            background-color: var(--bg-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Dark mode toggle */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #60a5fa;
            background-color: #60a5fa;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #334155;
        }
        .toggle-checkbox {
            right: 1.25rem;
            transition: all 0.3s ease;
        }
        .toggle-label {
            background-color: #e5e7eb;
            transition: background-color 0.3s ease;
        }

        /* Dark mode overrides for cards */
        html.dark .bg-white,
        html.dark .bg-white.rounded-lg {
            background-color: var(--bg-secondary) !important;
        }
        html.dark .bg-gray-50,
        html.dark .bg-gray-50.rounded {
            background-color: var(--bg-tertiary) !important;
        }
        html.dark .text-gray-900 {
            color: var(--text-primary) !important;
        }
        html.dark .text-gray-700 {
            color: var(--text-secondary) !important;
        }
        html.dark .text-gray-600 {
            color: var(--text-secondary) !important;
        }
        html.dark .text-gray-500 {
            color: var(--text-muted) !important;
        }
        html.dark .text-gray-400 {
            color: var(--text-muted) !important;
        }
        html.dark .divide-gray-200 > * {
            border-color: var(--border-color) !important;
        }
        html.dark .border-gray-200 {
            border-color: var(--border-color) !important;
        }
        html.dark .skeleton {
            background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%);
            background-size: 200% 100%;
        }
        html.dark select,
        html.dark input {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        /* Dark mode for Chart.js */
        html.dark .chart-container canvas {
            filter: brightness(0.9);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <header class="mb-8 animate-fade-in">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">Personal AI Dashboard</h1>
                    <p class="mt-2 text-gray-600">Real-time insights from your personal AI system</p>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <span class="live-indicator inline-block w-2 h-2 bg-green-500 rounded-full"></span>
                        <span class="text-sm text-gray-500">Live</span>
                        <span id="lastUpdated" class="text-xs text-gray-400"></span>
                    </div>
                    <!-- Dark mode toggle -->
                    <div class="flex items-center space-x-2">
                        <span class="text-sm" id="themeIcon">☀️</span>
                        <div class="relative inline-block w-12 align-middle select-none">
                            <input type="checkbox" name="toggle" id="darkModeToggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300" style="top: 0; left: 0;" />
                            <label for="darkModeToggle" class="toggle-label block overflow-hidden h-6 rounded-full cursor-pointer"></label>
                        </div>
                        <span class="text-sm" id="themeIconDark">🌙</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="grid gap-6 mb-8 grid-cols-1 md:grid-cols-2 lg:grid-cols-4">
            <!-- Profile Stats -->
            <div class="bg-white rounded-lg shadow p-6 card-hover animate-slide-in" style="animation-delay: 0.1s;">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Profile</h3>
                <div id="profile-stats" class="space-y-2">
                    <div class="skeleton h-4 w-32"></div>
                    <div class="skeleton h-4 w-24"></div>
                    <div class="skeleton h-4 w-28"></div>
                </div>
            </div>

            <!-- Habits Stats -->
            <div class="bg-white rounded-lg shadow p-6 card-hover animate-slide-in" style="animation-delay: 0.2s;">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Habits</h3>
                <div id="habits-stats" class="space-y-2">
                    <div class="skeleton h-4 w-40"></div>
                    <div class="skeleton h-4 w-32"></div>
                    <div class="skeleton h-4 w-36"></div>
                </div>
            </div>

            <!-- Traits Stats -->
            <div class="bg-white rounded-lg shadow p-6 card-hover animate-slide-in" style="animation-delay: 0.3s;">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Traits</h3>
                <div id="traits-stats" class="space-y-2">
                    <div class="skeleton h-4 w-40"></div>
                    <div class="skeleton h-4 w-36"></div>
                    <div class="skeleton h-4 w-32"></div>
                </div>
            </div>

            <!-- Goals Stats -->
            <div class="bg-white rounded-lg shadow p-6 card-hover animate-slide-in" style="animation-delay: 0.4s;">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Goals</h3>
                <div id="goals-stats" class="space-y-2">
                    <div class="skeleton h-4 w-32"></div>
                    <div class="skeleton h-4 w-28"></div>
                    <div class="skeleton h-4 w-36"></div>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid gap-6 mb-8">
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow p-6 card-hover animate-fade-in" style="animation-delay: 0.5s;">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Habits Progress</h3>
                    <div class="chart-container">
                        <canvas id="habitsChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow p-6 card-hover animate-fade-in" style="animation-delay: 0.6s;">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Traits Analysis</h3>
                    <div class="chart-container">
                        <canvas id="traitsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow p-6 mb-8 animate-fade-in" style="animation-delay: 0.7s;">
            <h3 class="text-lg font-medium text-gray-900 mb-4">Filters</h3>
            <div class="flex flex-wrap gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Time Range</label>
                    <select id="timeRange" class="border rounded px-3 py-2 w-32 focus:ring-2 focus:ring-blue-500 focus:border-transparent filter-transition">
                        <option value="week">Last Week</option>
                        <option value="month" selected>Last Month</option>
                        <option value="quarter">Last Quarter</option>
                        <option value="year">Last Year</option>
                        <option value="all">All Time</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                    <select id="categoryFilter" class="border rounded px-3 py-2 w-40 focus:ring-2 focus:ring-blue-500 focus:border-transparent filter-transition">
                        <option value="all" selected>All Categories</option>
                        <option value="produtividade">Productivity</option>
                        <option value="carreira">Career</option>
                        <option value="bem-estar">Well-being</option>
                        <option value="aprendizado">Learning</option>
                    </select>
                </div>
                <button id="applyFilters" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-200">
                    Apply Filters
                </button>
            </div>
        </div>

        <!-- Data Tables -->
        <div class="grid gap-6">
            <!-- Recent Activities -->
            <div class="bg-white rounded-lg shadow p-6 animate-fade-in" style="animation-delay: 0.8s;">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Recent Activities</h3>
                <div id="recent-activities" class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200" id="activitiesTableBody">
                            <tr>
                                <td colspan="4" class="px-6 py-4 text-center text-gray-500">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Observations -->
            <div class="bg-white rounded-lg shadow p-6 animate-fade-in" style="animation-delay: 0.9s;">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Recent Observations</h3>
                <div id="observations" class="space-y-3">
                    <div class="skeleton h-8 w-64"></div>
                    <div class="skeleton h-8 w-48"></div>
                    <div class="skeleton h-8 w-56"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Chart.js instances
        let habitsChart = null;
        let traitsChart = null;

        // Load initial data
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
            loadCharts();
            updateLastUpdated();
        });

        // Update last updated timestamp
        function updateLastUpdated() {
            const now = new Date();
            document.getElementById('lastUpdated').textContent = 
                `Last updated: ${now.toLocaleTimeString()}`;
        }

        // Load dashboard data
        async function loadDashboardData() {
            try {
                // Load profile data
                const profileResponse = await fetch('/api/profile');
                const profileData = await profileResponse.json();
                updateProfileStats(profileData);

                // Load habits data
                const habitsResponse = await fetch('/api/habits');
                const habitsData = await habitsResponse.json();
                updateHabitsStats(habitsData);

                // Load traits data
                const traitsResponse = await fetch('/api/traits');
                const traitsData = await traitsResponse.json();
                updateTraitsStats(traitsData);

                // Load goals data
                const goalsResponse = await fetch('/api/goals');
                const goalsData = await goalsResponse.json();
                updateGoalsStats(goalsData);

                // Load recent activities
                const activitiesResponse = await fetch('/api/activities');
                const activitiesData = await activitiesResponse.json();
                updateRecentActivities(activitiesData);

                // Load observations
                const observationsResponse = await fetch('/api/observations');
                const observationsData = await observationsResponse.json();
                updateObservations(observationsData);

                updateLastUpdated();
            } catch (error) {
                console.error('Error loading dashboard data:', error);
            }
        }

        // Update profile stats
        function updateProfileStats(data) {
            const container = document.getElementById('profile-stats');
            if (container && data) {
                container.innerHTML = `
                    <div class="animate-fade-in"><span class="font-medium">Name:</span> ${data.name || 'N/A'}</div>
                    <div class="animate-fade-in" style="animation-delay: 0.1s;"><span class="font-medium">Age:</span> ${data.age || 'N/A'}</div>
                    <div class="animate-fade-in" style="animation-delay: 0.2s;"><span class="font-medium">Timezone:</span> ${data.timezone || 'N/A'}</div>
                    <div class="animate-fade-in" style="animation-delay: 0.3s;"><span class="font-medium">Work Style:</span> ${data.work_style || 'N/A'}</div>
                `;
            }
        }

        // Update habits stats
        function updateHabitsStats(data) {
            const container = document.getElementById('habits-stats');
            if (container && data) {
                const activeHabits = data.filter(h => h.status === 'active').length;
                const totalCompletions = data.reduce((sum, h) => sum + (h.total_completions || 0), 0);
                const avgStreak = data.reduce((sum, h) => sum + (h.current_streak || 0), 0) / data.length || 0;

                container.innerHTML = `
                    <div class="animate-fade-in"><span class="font-medium">Active Habits:</span> ${activeHabits}/${data.length}</div>
                    <div class="animate-fade-in" style="animation-delay: 0.1s;"><span class="font-medium">Total Completions:</span> ${totalCompletions}</div>
                    <div class="animate-fade-in" style="animation-delay: 0.2s;"><span class="font-medium">Avg Current Streak:</span> ${avgStreak.toFixed(1)}</div>
                `;
            }
        }

        // Update traits stats
        function updateTraitsStats(data) {
            const container = document.getElementById('traits-stats');
            if (container && data) {
                const highConfidence = data.filter(t => (t.confidence_score || 0) > 0.7).length;
                const avgConfidence = data.reduce((sum, t) => sum + (t.confidence_score || 0), 0) / data.length || 0;

                container.innerHTML = `
                    <div class="animate-fade-in"><span class="font-medium">Total Traits:</span> ${data.length}</div>
                    <div class="animate-fade-in" style="animation-delay: 0.1s;"><span class="font-medium">High Confidence (>0.7):</span> ${highConfidence}</div>
                    <div class="animate-fade-in" style="animation-delay: 0.2s;"><span class="font-medium">Avg Confidence:</span> ${avgConfidence.toFixed(2)}</div>
                `;
            }
        }

        // Update goals stats
        function updateGoalsStats(data) {
            const container = document.getElementById('goals-stats');
            if (container && data) {
                const activeGoals = data.filter(g => g.status === 'active').length;
                const completedGoals = data.filter(g => g.status === 'completed').length;
                const avgProgress = data.reduce((sum, g) => sum + (g.progress || 0), 0) / data.length || 0;

                container.innerHTML = `
                    <div class="animate-fade-in"><span class="font-medium">Active Goals:</span> ${activeGoals}</div>
                    <div class="animate-fade-in" style="animation-delay: 0.1s;"><span class="font-medium">Completed Goals:</span> ${completedGoals}</div>
                    <div class="animate-fade-in" style="animation-delay: 0.2s;"><span class="font-medium">Avg Progress:</span> ${avgProgress.toFixed(1)}%</div>
                `;
            }
        }

        // Load charts data
        async function loadCharts() {
            try {
                // Load habits chart data
                const habitsChartResponse = await fetch('/api/habits-chart');
                const habitsChartData = await habitsChartResponse.json();
                renderHabitsChart(habitsChartData);

                // Load traits chart data
                const traitsChartResponse = await fetch('/api/traits-chart');
                const traitsChartData = await traitsChartResponse.json();
                renderTraitsChart(traitsChartData);
            } catch (error) {
                console.error('Error loading charts:', error);
            }
        }

        // Render habits chart
        function renderHabitsChart(data) {
            const ctx = document.getElementById('habitsChart').getContext('2d');
            if (habitsChart) {
                habitsChart.destroy();
            }
            habitsChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Completions',
                        data: data.completions,
                        backgroundColor: 'rgba(59, 130, 246, 0.5)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Habits Completion Count'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }

        // Render traits chart
        function renderTraitsChart(data) {
            const ctx = document.getElementById('traitsChart').getContext('2d');
            if (traitsChart) {
                traitsChart.destroy();
            }
            traitsChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Confidence Scores',
                        data: data.scores,
                        backgroundColor: 'rgba(16, 185, 129, 0.2)',
                        borderColor: 'rgba(16, 185, 129, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Traits Confidence Analysis'
                        }
                    },
                    scales: {
                        r: {
                            suggestedMin: 0,
                            suggestedMax: 1
                        }
                    }
                }
            });
        }

        // Update recent activities table
        function updateRecentActivities(data) {
            const tbody = document.getElementById('activitiesTableBody');
            if (tbody && data) {
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No recent activities</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map((activity, index) => `
                    <tr class="animate-fade-in" style="animation-delay: ${index * 0.05}s;">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${activity.type}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${activity.description}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${activity.date}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">${activity.status === 'completed' ? 
                            '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full status-completed">Completed</span>' : 
                            '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full status-pending">Pending</span>'}</td>
                    </tr>
                `).join('');
            }
        }

        // Update observations
        function updateObservations(data) {
            const container = document.getElementById('observations');
            if (container && data) {
                if (data.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">No recent observations</p>';
                    return;
                }

                container.innerHTML = data.map((obs, index) => `
                    <div class="border-l-4 border-blue-500 pl-4 mb-3 animate-slide-in" style="animation-delay: ${index * 0.1}s;">
                        <p class="text-sm text-gray-700">${obs.content}</p>
                        <p class="text-xs text-gray-500">${new Date(obs.timestamp).toLocaleString()}</p>
                    </div>
                `).join('');
            }
        }

        // Filter functionality
        document.getElementById('applyFilters')?.addEventListener('click', () => {
            const timeRange = document.getElementById('timeRange')?.value;
            const category = document.getElementById('categoryFilter')?.value;
            
            console.log('Applying filters:', { timeRange, category });
            // Reload data with filters
            loadDashboardData();
            loadCharts();
        });

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadDashboardData();
            loadCharts();
        }, 30000);

        // Dark mode toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const html = document.documentElement;

        // Load saved theme from localStorage
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                html.classList.remove('light');
                html.classList.add('dark');
                darkModeToggle.checked = true;
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                darkModeToggle.checked = false;
            }
        }

        // Toggle theme
        function toggleTheme() {
            if (html.classList.contains('light')) {
                html.classList.remove('light');
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                updateChartColors('dark');
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                localStorage.setItem('theme', 'light');
                updateChartColors('light');
            }
        }

        // Update chart colors based on theme
        function updateChartColors(theme) {
            const textColor = theme === 'dark' ? '#f1f5f9' : '#374151';
            const gridColor = theme === 'dark' ? 'rgba(148, 163, 184, 0.1)' : 'rgba(0, 0, 0, 0.1)';

            if (habitsChart) {
                habitsChart.options.scales.x.ticks.color = textColor;
                habitsChart.options.scales.y.ticks.color = textColor;
                habitsChart.options.scales.x.grid.color = gridColor;
                habitsChart.options.scales.y.grid.color = gridColor;
                habitsChart.options.plugins.title.color = textColor;
                habitsChart.update();
            }

            if (traitsChart) {
                traitsChart.options.scales.r.ticks.color = textColor;
                traitsChart.options.scales.r.grid.color = gridColor;
                traitsChart.options.plugins.title.color = textColor;
                traitsChart.update();
            }
        }

        // Initialize theme on page load
        loadTheme();
        darkModeToggle.addEventListener('change', toggleTheme);
    </script>
</body>
</html>
